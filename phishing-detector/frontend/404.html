<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function () {
    try {
      if (localStorage.getItem('sentrynet_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* storage unavailable */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | SentryNet</title>
<meta name="description" content="This page doesn't exist — but at least it's not a phishing site.">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/notfound.css">
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="loader-mark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z" fill="currentColor"/></svg>
  </div>
  <div class="loader-ring-outer"></div>
</div>

<header class="navbar scrolled">
  <div class="container nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z" fill="currentColor"/><path d="M9.5 12l1.8 1.8L15 10" stroke="#0A0E1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Sentry<span>Net</span></span>
    </a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="nf-main">
  <div class="container">
    <div class="nf-content">
      <div class="nf-scan-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11 4a7 7 0 104.6 12.3l4.05 4.05a1 1 0 001.42-1.42l-4.05-4.05A7 7 0 0011 4z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="chip chip-danger nf-chip">404 — NOT FOUND</span>
      <h1>This page didn't pass the scan</h1>
      <p>The link you followed doesn't match anything in our routing table — no phishing here, just a page that doesn't exist.</p>

      <div class="nf-fake-console glass">
        <div class="nf-console-line"><span class="nf-dim">$</span> sentrynet scan <span class="nf-url">{{current_path}}</span></div>
        <div class="nf-console-line nf-result">→ <span class="chip chip-danger">404 NOT_FOUND</span> route does not exist on this server</div>
      </div>

      <div class="nf-actions">
        <a href="index.html" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to home
        </a>
        <a href="scanner.html" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" fill="none"><path d="M11 4a7 7 0 104.6 12.3l4.05 4.05a1 1 0 001.42-1.42l-4.05-4.05A7 7 0 0011 4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Go to Scanner
        </a>
      </div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script>
  var pathEl = document.querySelector('.nf-url');
  if (pathEl) pathEl.textContent = location.pathname.split('/').pop() || '/';
</script>
</body>
</html>
